<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade2</title>
    <style>
        img {
            width: 300px;
            height: 200px;
        }
        #CSS{
            color:coral;
        }
        h1, p {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        hr{
            border: 8px solid black;
        }
        #fundo{
            background-color: rgb(33, 190, 230);
        }
        .cor{
            color: rgb(204, 0, 255);
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }
        .font{
            font-size: 25px;
            border: 2px solid rgb(171, 207, 9);
        }
        .size{
            font-style:italic ;
            font-size: 30px;
            text-decoration:underline;
            background-color: rgb(97, 33, 170);
            color: coral;
        }
        .border{
            border: 2px solid rgb(171, 207, 9);
            font-style: italic;
            text-decoration: underline;
            color: limegreen;
        }
    </style>
</head>
<body>
    <h1>Página Teste CSS</h1>

    <hr>
    <img src="_imagens/css01.jpg">
    <img src="_imagens/css02.jpg">
    <img src="_imagens/css03.jpg">
    <img src="_imagens/css04.png">
    <hr>

    <h1 id="CSS">CSS É VIDA</h1>
    <p>Diversas possibilidades de Incrementar seu HTML</p>

    <h1>Exemplo de Cores no CSS</h1>

    <p id="fundo">Exemplo de texto com cor de fundo</p>

    <hr>
    <p class="cor">Exemplo de texto com mudança de cor da fonte </p>
    <hr>

    <p class="font">Exemplo de texto com borda colorida</p>

    <h1>Misturando Tudo</h1>

    <p class="border">Exemplo de texto com várias formatações</p>

    <p class="size"><b>Mais um exemplo<b></p>
</body>
</html>
